; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
	node-id-1
	; node-id-3
	node-id-254

[common]
; Pinned to Arduino-ESP32 2.0.x. Core 3.x breaks RadioHead's RH_ASK timers and esp_task_wdt_init().
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_deps = 

; board definitions
[board-esp32doit]
board = esp32doit-devkit-v1
PINOUT_RFM95_CS=5
PINOUT_RFM95_RST=14
PINOUT_RFM95_INT=2

[board-tbeam]
board = ttgo-t-beam
PINOUT_RFM95_CS=18
PINOUT_RFM95_RST=14
PINOUT_RFM95_INT=26

; node definitions
[env:node-id-1]
monitor_port = COM9
build_flags = 
	-D SELF_ADDRESS=1
	-D TARGET_ADDRESS=254
    -D RFM95_CS=${board-tbeam.PINOUT_RFM95_CS}
    -D RFM95_RST=${board-tbeam.PINOUT_RFM95_RST}
    -D RFM95_INT=${board-tbeam.PINOUT_RFM95_INT}
upload_port = ${this.monitor_port}
extends = common, board-tbeam

[env:node-id-3]
monitor_port = COM4
build_flags = 
	-D SELF_ADDRESS=3
	-D TARGET_ADDRESS=254
    -D RFM95_CS=${board-esp32doit.PINOUT_RFM95_CS}
    -D RFM95_RST=${board-esp32doit.PINOUT_RFM95_RST}
    -D RFM95_INT=${board-esp32doit.PINOUT_RFM95_INT}
upload_port = ${this.monitor_port}
extends = common, board-esp32doit

; 255 is RadioHead's broadcast address, which is never routed or ACKed,
; so the end node uses 254.
[env:node-id-254]
monitor_port = COM7
build_flags = 
	-D SELF_ADDRESS=254
	-D TARGET_ADDRESS=1
    -D RFM95_CS=${board-esp32doit.PINOUT_RFM95_CS}
    -D RFM95_RST=${board-esp32doit.PINOUT_RFM95_RST}
    -D RFM95_INT=${board-esp32doit.PINOUT_RFM95_INT}
upload_port = ${this.monitor_port}
extends = common, board-esp32doit

; Forced topology on a desk: RH_TEST_NETWORK=4 drops packets so nodes form the
; line 1-2-3, so node 1 can only reach node 3 through node 2.
; Must be a build flag, it is read when RadioHead's RHRouter.cpp is compiled.
[testnet]
build_flags =
	-D RH_TEST_NETWORK=4
	-D ENDNODE_ADDRESS=3

[env:testnet-node-1]
monitor_port = COM9
build_flags =
	${testnet.build_flags}
	-D SELF_ADDRESS=1
	-D TARGET_ADDRESS=3
	-D RFM95_CS=${board-tbeam.PINOUT_RFM95_CS}
	-D RFM95_RST=${board-tbeam.PINOUT_RFM95_RST}
	-D RFM95_INT=${board-tbeam.PINOUT_RFM95_INT}
upload_port = ${this.monitor_port}
extends = common, board-tbeam

[env:testnet-node-2]
monitor_port = COM4
build_flags =
	${testnet.build_flags}
	-D SELF_ADDRESS=2
	-D TARGET_ADDRESS=3
	-D RFM95_CS=${board-esp32doit.PINOUT_RFM95_CS}
	-D RFM95_RST=${board-esp32doit.PINOUT_RFM95_RST}
	-D RFM95_INT=${board-esp32doit.PINOUT_RFM95_INT}
upload_port = ${this.monitor_port}
extends = common, board-esp32doit

[env:testnet-node-3]
monitor_port = COM7
build_flags =
	${testnet.build_flags}
	-D SELF_ADDRESS=3
	-D TARGET_ADDRESS=1
	-D RFM95_CS=${board-esp32doit.PINOUT_RFM95_CS}
	-D RFM95_RST=${board-esp32doit.PINOUT_RFM95_RST}
	-D RFM95_INT=${board-esp32doit.PINOUT_RFM95_INT}
upload_port = ${this.monitor_port}
extends = common, board-esp32doit

; Host simulator: pio test -e native. Needs a host g++ (Linux, macOS, WSL or MSYS2 on Windows).
; The vendored RadioHead is ignored here, MeshSim builds only the mesh parts of it.
[env:native]
platform = native
lib_ignore = RadioHead
lib_compat_mode = off
build_flags =
	-std=gnu++17
	-pthread
	-I lib/RadioHead
	-I lib/MeshSim/include
	; RH_PLATFORM_UNIX, so RadioHead uses RHutil/simulator.h instead of Arduino.h.
	-D RH_PLATFORM=6
	; Failed asserts return instead of longjmp, so SimNode destructors stop their threads.
	-D UNITY_EXCLUDE_SETJMP_H

; Four simulated nodes on the README topology: pio run -e sim-demo -t exec
[env:sim-demo]
extends = env:native
build_src_filter = -<*> +<../sim/demo.cpp>

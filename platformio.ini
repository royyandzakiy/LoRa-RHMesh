; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Hardware envs are named <what>-node-<address>. Set monitor_port/upload_port to your
; own COM ports, or remove them to let PlatformIO auto-detect.

[platformio]
default_envs =
	node-id-1
	node-id-254

[common]
; Pinned to Arduino-ESP32 2.0.x. Core 3.x breaks RadioHead's RH_ASK timers and esp_task_wdt_init().
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
; MeshSim provides a netinet/in.h stub, which the ESP32 build would otherwise pick up.
lib_ignore = MeshSim

; ---------------------------------------------------------------- boards

[board-esp32doit]
extends = common
board = esp32doit-devkit-v1
pin_flags = -D RFM95_CS=5 -D RFM95_RST=14 -D RFM95_INT=2

[board-tbeam]
extends = common
board = ttgo-t-beam
pin_flags = -D RFM95_CS=18 -D RFM95_RST=14 -D RFM95_INT=26

; ---------------------------------------------------------------- mesh node (src/main.cpp)

[env:node-id-1]
extends = board-tbeam
monitor_port = COM9
upload_port = ${this.monitor_port}
build_flags = ${board-tbeam.pin_flags} -D SELF_ADDRESS=1 -D TARGET_ADDRESS=254

[env:node-id-3]
extends = board-esp32doit
monitor_port = COM4
upload_port = ${this.monitor_port}
build_flags = ${board-esp32doit.pin_flags} -D SELF_ADDRESS=3 -D TARGET_ADDRESS=254

; 255 is RadioHead's broadcast address, which is never routed or ACKed,
; so the end node uses 254.
[env:node-id-254]
extends = board-esp32doit
monitor_port = COM7
upload_port = ${this.monitor_port}
build_flags = ${board-esp32doit.pin_flags} -D SELF_ADDRESS=254 -D TARGET_ADDRESS=1

; ---------------------------------------------------------------- forced topology on a desk

; RH_TEST_NETWORK=4 drops packets so nodes form the line 1-2-3, so node 1 can only
; reach node 3 through node 2. Must be a build flag, it is read when RadioHead's
; RHRouter.cpp is compiled.
[testnet]
flags = -D RH_TEST_NETWORK=4 -D ENDNODE_ADDRESS=3

[env:testnet-node-1]
extends = board-tbeam
monitor_port = COM9
upload_port = ${this.monitor_port}
build_flags = ${board-tbeam.pin_flags} ${testnet.flags} -D SELF_ADDRESS=1 -D TARGET_ADDRESS=3

[env:testnet-node-2]
extends = board-esp32doit
monitor_port = COM4
upload_port = ${this.monitor_port}
build_flags = ${board-esp32doit.pin_flags} ${testnet.flags} -D SELF_ADDRESS=2 -D TARGET_ADDRESS=3

[env:testnet-node-3]
extends = board-esp32doit
monitor_port = COM7
upload_port = ${this.monitor_port}
build_flags = ${board-esp32doit.pin_flags} ${testnet.flags} -D SELF_ADDRESS=3 -D TARGET_ADDRESS=1

; ---------------------------------------------------------------- long range mesh

; SF12 reaches furthest but one ~40 byte frame takes about 3 s on air (an ACK ~1 s),
; so every timeout scales up. Rough values for 2 hops, tune them on real hardware.
; Both sides must use the same MODEM_CONFIG.
[longrange]
flags =
	-D MODEM_CONFIG=Bw125Cr48Sf4096
	-D HOP_TIMEOUT_MS=2500
	-D ACK_TIMEOUT_MS=30000
	-D RH_MESH_ARP_TIMEOUT=15000
	-D SEND_INTERVAL_MS=60000
	-D WDT_TIMEOUT_S=120

[env:longrange-node-1]
extends = board-tbeam
monitor_port = COM9
upload_port = ${this.monitor_port}
build_flags = ${board-tbeam.pin_flags} ${longrange.flags} -D SELF_ADDRESS=1 -D TARGET_ADDRESS=254

[env:longrange-node-254]
extends = board-esp32doit
monitor_port = COM7
upload_port = ${this.monitor_port}
build_flags = ${board-esp32doit.pin_flags} ${longrange.flags} -D SELF_ADDRESS=254 -D TARGET_ADDRESS=1

; ---------------------------------------------------------------- examples/01-range-test

[range-test]
build_src_filter = -<*> +<../examples/01-range-test/>
; Pick one of RH_RF95::ModemConfigChoice, the same on both sides.
flags = -D MODEM_CONFIG=Bw125Cr45Sf128

[env:range-test-sender]
extends = board-tbeam
monitor_port = COM9
upload_port = ${this.monitor_port}
build_src_filter = ${range-test.build_src_filter}
build_flags = ${board-tbeam.pin_flags} ${range-test.flags} -D RANGE_TEST_SENDER

[env:range-test-receiver]
extends = board-esp32doit
monitor_port = COM7
upload_port = ${this.monitor_port}
build_src_filter = ${range-test.build_src_filter}
build_flags = ${board-esp32doit.pin_flags} ${range-test.flags}

; ---------------------------------------------------------------- examples/02-static-routing

[static-routing]
build_src_filter = -<*> +<../examples/02-static-routing/>
flags = -D RH_TEST_NETWORK=4

[env:static-routing-node-1]
extends = board-tbeam
monitor_port = COM9
upload_port = ${this.monitor_port}
build_src_filter = ${static-routing.build_src_filter}
build_flags = ${board-tbeam.pin_flags} ${static-routing.flags} -D SELF_ADDRESS=1

[env:static-routing-node-2]
extends = board-esp32doit
monitor_port = COM4
upload_port = ${this.monitor_port}
build_src_filter = ${static-routing.build_src_filter}
build_flags = ${board-esp32doit.pin_flags} ${static-routing.flags} -D SELF_ADDRESS=2

[env:static-routing-node-3]
extends = board-esp32doit
monitor_port = COM7
upload_port = ${this.monitor_port}
build_src_filter = ${static-routing.build_src_filter}
build_flags = ${board-esp32doit.pin_flags} ${static-routing.flags} -D SELF_ADDRESS=3

; ---------------------------------------------------------------- host simulator

; pio test -e native. Needs a host g++ (Linux, macOS, WSL or MSYS2 on Windows).
; The vendored RadioHead is ignored here, MeshSim builds only the mesh parts of it.
[env:native]
platform = native
lib_ignore = RadioHead
lib_compat_mode = off
build_flags =
	-std=gnu++17
	-pthread
	-I lib/RadioHead
	-I lib/MeshSim/include
	; RH_PLATFORM_UNIX, so RadioHead uses RHutil/simulator.h instead of Arduino.h.
	-D RH_PLATFORM=6
	; Failed asserts return instead of longjmp, so SimNode destructors stop their threads.
	-D UNITY_EXCLUDE_SETJMP_H

; Four simulated nodes on the README topology: pio run -e sim-demo -t exec
[env:sim-demo]
extends = env:native
build_src_filter = -<*> +<../sim/demo.cpp>

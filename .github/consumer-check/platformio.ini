; A project that uses LoRa-RHMesh the way a user would. CI copies it out of the repo and
; points LORA_RHMESH_DIR at the checkout, so it checks the published library layout.

[env]
lib_deps = symlink://${sysenv.LORA_RHMESH_DIR}

[env:esp32]
platform = espressif32@6.10.0
framework = arduino
board = esp32doit-devkit-v1

[env:native]
platform = native
build_flags = -D UNITY_EXCLUDE_SETJMP_H

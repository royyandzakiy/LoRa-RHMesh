name: CI

on:
  push:
  pull_request:

jobs:
  simulator:
    name: Simulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini', 'library.json') }}
      - run: pip install platformio
      - run: pio test -e native
      - name: Run the demo
        run: pio run -e sim-demo -t exec

  firmware:
    name: PlatformIO examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32-${{ hashFiles('platformio.ini', 'library.json') }}
      - run: pip install platformio
      # Every env except the host ones, read from platformio.ini so new envs are built too.
      - name: Build all hardware envs
        run: |
          envs=$(pio project config --json-output | python -c "
          import json, sys
          for section, _ in json.load(sys.stdin):
              if section.startswith('env:') and section not in ('env:native', 'env:sim-demo'):
                  print('-e', section[4:], end=' ')
          ")
          pio run $envs

  arduino:
    name: Arduino IDE examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: ./
            - name: RadioHead
          sketch-paths: |
            - examples

  consumer:
    name: Library as a dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Check the package contents
        run: |
          pio pkg pack -o "$RUNNER_TEMP/lora-rhmesh.tar.gz"
          tar -tzf "$RUNNER_TEMP/lora-rhmesh.tar.gz" > "$RUNNER_TEMP/files.txt"
          grep -q "^src/LoRaRHMesh.h$" "$RUNNER_TEMP/files.txt"
          grep -q "^extras/sim-radiohead/RHMesh.cpp$" "$RUNNER_TEMP/files.txt"
          ! grep -qE "^(\.github|scripts|\.pio)/" "$RUNNER_TEMP/files.txt"
      # Outside the checkout, so the project isn't inside the library it depends on.
      - name: Build a project that depends on the library
        env:
          LORA_RHMESH_DIR: ${{ github.workspace }}
        run: |
          cp -r .github/consumer-check "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          pio run -e esp32
          pio test -e native
